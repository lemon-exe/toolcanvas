name: Build

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: toolcanvas-jar
          path: build/libs/*.jar
      # Publishes the jar as a plain download at /releases/latest (no zip to unpack).
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Tool Canvas (latest build)
          body: Drop the .jar into your mods folder (host and every player). Built from ${{ github.sha }}.
          make_latest: true
          files: build/libs/*.jar
